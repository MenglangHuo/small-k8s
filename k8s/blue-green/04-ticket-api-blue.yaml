apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-api-blue
  namespace: ticket-prod
  labels:
    app.kubernetes.io/name: ticket-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: mono-ticket
    version: blue
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ticket-api
      version: blue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ticket-api
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: mono-ticket
        version: blue
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ticket-api
          image: menglang6969/ticket-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: MONGO_APP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ticket-secrets
                  key: MONGO_APP_USERNAME
            - name: MONGO_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ticket-secrets
                  key: MONGO_APP_PASSWORD
            - name: MONGODB_URI
              value: "mongodb://$(MONGO_APP_USERNAME):$(MONGO_APP_PASSWORD)@mongo-svc:27017/ticket_db?authSource=ticket_db"
            - name: TICKET_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: ticket-secrets
                  key: TICKET_API_SECRET
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -XX:+UseSerialGC
                -Xmx256m
                -Xms128m
                -XX:MaxMetaspaceSize=96m
                -XX:+UseContainerSupport
                -Djava.io.tmpdir=/tmp
          envFrom:
            - configMapRef:
                name: ticket-config
            - secretRef:
                name: ticket-secrets
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "200Mi"
              cpu: "150m"
            limits:
              memory: "400Mi"
              cpu: "600m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8000
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
