# --------------------------------------------------
# Ticket Admin: Vue.js SPA (Nginx) + ConfigMap + Service
# --------------------------------------------------
# The frontend is a Vue.js SPA served by Nginx.
# Nginx also acts as a reverse proxy:
#   /api/*       → ticket-api-svc:8000
#   /token       → ticket-api-svc:8000
#   /login       → ticket-api-svc:8000
#   /two-factor  → ticket-api-svc:8000
#   /files       → ticket-api-svc:8000
# --------------------------------------------------

# --- Nginx Configuration (reverse proxy + SPA routing) ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: ticket-prod
  labels:
    app.kubernetes.io/name: ticket-admin
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: mono-ticket
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ---- Security Headers ----
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # ---- Gzip Compression ----
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css application/json application/javascript
                   text/xml application/xml application/xml+rss text/javascript
                   image/svg+xml;

        # ---- Static Assets: Cache aggressively ----
        # Vite hashes filenames, so long cache is safe
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ---- API Reverse Proxy ----
        # Forwards /api requests to the Spring Boot backend service
        location /api/ {
            proxy_pass http://ticket-api-svc.ticket-prod.svc.cluster.local:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            client_max_body_size 20m;
        }

        # ---- Auth & File Endpoints → Backend ----
        location /token {
            proxy_pass http://ticket-api-svc.ticket-prod.svc.cluster.local:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /login {
            proxy_pass http://ticket-api-svc.ticket-prod.svc.cluster.local:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /two-factor {
            proxy_pass http://ticket-api-svc.ticket-prod.svc.cluster.local:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /files {
            proxy_pass http://ticket-api-svc.ticket-prod.svc.cluster.local:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 20m;
        }

        # ---- SPA Fallback ----
        # All other routes → index.html (Vue Router handles client-side routing)
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

---
# --- Ticket Admin Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-admin
  namespace: ticket-prod
  labels:
    app.kubernetes.io/name: ticket-admin
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: mono-ticket
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ticket-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ticket-admin
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: mono-ticket
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ticket-admin
          # Pre-built release image on Docker Hub
          image: menglang6969/ticket-admin:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          # Mount the nginx reverse proxy config
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "96Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-config

---
# --- Ticket Admin ClusterIP Service ---
# Ingress routes yourdomain.com → this service
apiVersion: v1
kind: Service
metadata:
  name: ticket-admin-svc
  namespace: ticket-prod
  labels:
    app.kubernetes.io/name: ticket-admin
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: mono-ticket
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ticket-admin
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      name: http
