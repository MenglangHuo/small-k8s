# --------------------------------------------------
# MongoDB: PersistentVolumeClaim + Deployment + Service
# --------------------------------------------------
# Single-node MongoDB for a demo. It is not highly available; back it up.
# Bootstrap admin and app-user credentials come from ticket-secrets.
# Never expose port 27017. Mongo init scripts only run on an empty data directory.
# --------------------------------------------------

# --- Persistent Storage ---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pvc
  namespace: ticket-prod
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: mono-ticket
spec:
  accessModes:
    - ReadWriteOnce
  # K3s ships with "local-path" provisioner by default
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi

---
# --- MongoDB Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-db
  namespace: ticket-prod
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: mono-ticket
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: mono-ticket
    spec:
      containers:
        - name: mongodb
          # Pin a supported minor version and update deliberately after backup.
          image: mongo:7.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 27017
              name: mongo
          env:
            - name: MONGO_INITDB_DATABASE
              value: "ticket_db"
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ticket-secrets
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ticket-secrets
                  key: MONGO_INITDB_ROOT_PASSWORD
            - name: MONGO_APP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ticket-secrets
                  key: MONGO_APP_USERNAME
            - name: MONGO_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ticket-secrets
                  key: MONGO_APP_PASSWORD
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
            - name: mongo-init
              mountPath: /docker-entrypoint-initdb.d/10-create-app-user.sh
              subPath: 10-create-app-user.sh
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "200Mi"
              cpu: "300m"
          # Readiness: Is MongoDB accepting connections?
          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          # Liveness: Is MongoDB still alive?
          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: mongo-pvc
        - name: mongo-init
          configMap:
            name: mongo-init
            defaultMode: 0555

---
# Create a database-scoped account during first initialization.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-init
  namespace: ticket-prod
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: mono-ticket
data:
  10-create-app-user.sh: |
    #!/bin/bash
    set -euo pipefail
    # Connect using root admin credentials if authentication is active
    if mongosh "$MONGO_INITDB_DATABASE" -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --quiet --eval "db.adminCommand('ping')" >/dev/null 2>&1; then
      AUTH_OPTS=(-u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin)
    else
      AUTH_OPTS=()
    fi

    mongosh "$MONGO_INITDB_DATABASE" "${AUTH_OPTS[@]}" --quiet --eval \
      "if (!db.getUser('$MONGO_APP_USERNAME')) { db.createUser({user: '$MONGO_APP_USERNAME', pwd: '$MONGO_APP_PASSWORD', roles: [{role: 'readWrite', db: '$MONGO_INITDB_DATABASE'}]}); print('Created app user: $MONGO_APP_USERNAME'); } else { print('App user already exists'); }"

---
# --- MongoDB ClusterIP Service ---
# Other pods connect to MongoDB using: mongo-svc:27017
apiVersion: v1
kind: Service
metadata:
  name: mongo-svc
  namespace: ticket-prod
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: mono-ticket
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mongodb
  ports:
    - port: 27017
      targetPort: 27017
      name: mongo
