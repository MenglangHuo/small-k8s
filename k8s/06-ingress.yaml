apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticket-ingress
  namespace: ticket-prod
  labels:
    app.kubernetes.io/part-of: mono-ticket
    app.kubernetes.io/component: ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.middlewares: ticket-prod-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ticket-admin.yourdomain.com
        - ticket-api.yourdomain.com
      secretName: ticket-prod-tls-secret
  rules:
    # 1. Frontend Vue Admin SPA
    - host: ticket-admin.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ticket-admin-svc
                port:
                  number: 80

    # 2. Backend Spring Boot WebFlux API
    - host: ticket-api.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ticket-api-svc
                port:
                  number: 8000
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  namespace: ticket-prod
  labels:
    app.kubernetes.io/part-of: mono-ticket
spec:
  redirectScheme:
    scheme: https
    permanent: true