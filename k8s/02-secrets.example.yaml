# --------------------------------------------------
# Secret: Sensitive credentials
# --------------------------------------------------
# Reference template only; the deployment script does not apply this file.
# Create the Secret from a protected env file as described in the deployment guide.
#
# DO NOT commit real secrets to Git!
# Add this file to .gitignore or use sealed-secrets.
# --------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: ticket-secrets
  namespace: ticket-prod
  labels:
    app.kubernetes.io/part-of: mono-ticket
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # MongoDB bootstrap admin. Used only during first database initialization.
  MONGO_INITDB_ROOT_USERNAME: "CHANGE_ME"
  MONGO_INITDB_ROOT_PASSWORD: "CHANGE_ME"
  # Least-privilege application account (readWrite on ticket_db only).
  MONGO_APP_USERNAME: "CHANGE_ME"
  MONGO_APP_PASSWORD: "CHANGE_ME"
  TICKET_API_SECRET: "CHANGE_ME"

  # ---- AWS S3 Credentials ----
  AWS_ACCESS_KEY_ID: "CHANGE_ME"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME"
  AWS_BUCKET_PRIVATE: "CHANGE_ME"
  AWS_BUCKET_STATIC: "CHANGE_ME"
  AWS_STATIC_URL: "CHANGE_ME"
  AWS_PRIVATE_URL: "CHANGE_ME"
  AWS_PRIVATE_FILE_EXPIRED: "3600"

  # ---- Telegram Bot ----
  TELEGRAM_BOT_TOKEN: "CHANGE_ME"
  TELEGRAM_BOT_USERNAME: "CHANGE_ME"
  TELEGRAM_CHAT_ID: "CHANGE_ME"
  TELEGRAM_WEBHOOK_SECRET: "CHANGE_ME"
