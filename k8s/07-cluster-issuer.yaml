# --------------------------------------------------
# ClusterIssuer: Let's Encrypt SSL Certificate Issuer
# --------------------------------------------------
# This creates a cluster-wide certificate issuer that
# uses HTTP-01 challenge to verify domain ownership.
#
# ⚠️  REPLACE "admin@yourdomain.com" with your real email!
#     Let's Encrypt will send expiry warnings to this email.
# --------------------------------------------------
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app.kubernetes.io/part-of: mono-ticket
    app.kubernetes.io/component: tls
spec:
  acme:
    # Let's Encrypt Production ACME Server
    server: https://acme-v02.api.letsencrypt.org/directory
    # Your email for certificate expiry notifications
    email: huomenglang@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
