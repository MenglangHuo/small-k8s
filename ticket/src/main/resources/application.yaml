server:
  port: ${SERVER_PORT:8888}
  netty:
    accesslog:
      enabled: ${SERVER_NETTY_ACCESSLOG_ENABLED:true}

logging:
  level:
    root: INFO
    com.menglang.ticket: INFO
    org.springframework.web: INFO

spring:
  application:
    name: ticket
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/ticket_db}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/ticket_db}
      auto-index-creation: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    date-format: "yyyy-MM-dd HH:mm:ss"
    time-zone: "Asia/Phnom_Penh"

aws:
  s3:
    region: ${AWS_DEFAULT_REGION:us-east-1}
    bucket-private: ${AWS_BUCKET_PRIVATE:rumluos-app}
    bucket-static: ${AWS_BUCKET_STATIC:rumluos-app}
    presigned-expiry-seconds: ${AWS_PRIVATE_FILE_EXPIRED:3600}
    static-url: ${AWS_STATIC_URL:}
    private-url: ${AWS_PRIVATE_URL:}
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  bot-username: ${TELEGRAM_BOT_USERNAME:}
  default-chat-id: ${TELEGRAM_CHAT_ID:}
  webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
  invite-expiry-days: ${TELEGRAM_INVITE_EXPIRY_DAYS:7}

resilience4j:
  circuitbreaker:
    instances:
      telegram_api:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 300s
        permitted-number-of-calls-in-half-open-state: 3

ticket:
  api-secret: ${TICKET_API_SECRET:}
  default-prefix: ${TICKET_DEFAULT_PREFIX:TCK}
  outbox:
    polling-interval-ms: 5000
    batch-size: 50
    max-attempts: 5
